# Instância de TESTE na sua máquina (site + painel + API + banco próprio), separada de qualquer site no ar.
# Rode os comandos na pasta do projeto (onde está este arquivo). Funciona no Docker Desktop (Windows/Mac) e no Linux.
#
# 1. SUBIR (a 1ª vez demora: baixa as imagens e monta o app)
#      docker compose -f compose.teste.yaml up -d --build
# 2. PEGAR O LINK público de teste (https://....trycloudflare.com)
#      docker compose -f compose.teste.yaml logs tunel
#    (no Linux/Mac, só o link:  docker compose -f compose.teste.yaml logs tunel | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com')
#    (no PowerShell:            docker compose -f compose.teste.yaml logs tunel | Select-String trycloudflare)
#    Também abre direto em http://localhost:8090  (painel: /painel/ · privacidade: /privacidade/)
# 3. CRIAR O USUÁRIO do painel (mostra a senha temporária uma vez; o painel pede para trocar e para aceitar o termo)
#      docker exec -it erivelto-teste python app.py usuario voce@exemplo.com "Teste"
#    Esqueceu a senha:  docker exec -it erivelto-teste python app.py senha voce@exemplo.com
# 4. DESLIGAR (os dados de teste ficam guardados para a próxima vez)
#      docker compose -f compose.teste.yaml down
# 5. APAGAR OS DADOS DE TESTE (banco e fotos) e começar do zero
#      docker compose -f compose.teste.yaml down -v
#
# O link aleatório muda a cada vez que o túnel reinicia. Qualquer pessoa com o link abre o site; o painel pede senha.
# Não cadastre dado real.
# "Unauthorized: Tunnel not found" no log = o Cloudflare apagou o túnel rápido (PC dormiu ou ficou muito tempo sem conexão).
#   Criar um túnel novo (link novo): docker compose -f compose.teste.yaml up -d --force-recreate tunel
# Os arquivos de site/ são lidos direto da pasta: mudou um arquivo, é só recarregar a página. Mudou app/app.py: suba de novo com --build.
#
# Onde ficam os dados: em dois VOLUMES do Docker (erivelto-teste_banco e erivelto-teste_fotos), não em pasta do projeto.
#   Motivo: no Docker Desktop do Windows o PostgreSQL costuma falhar quando o banco fica numa pasta do Windows (permissões),
#   e no Linux a pasta de fotos nasceria como root e o app (usuário sem root) não conseguiria gravar. No volume, as duas coisas funcionam.
#   Ver as fotos enviadas:  docker exec erivelto-teste ls -l /dados/midia
#   Copiar para o PC:       docker cp erivelto-teste:/dados/midia ./fotos-do-teste
#   Se existir uma pasta ./dados-teste/banco ou ./dados-teste/app de uma versão antiga deste arquivo, pode apagar: não é mais usada.
#
# !!! TODOS OS SEGREDOS ABAIXO SÃO FIXOS E PÚBLICOS, SÓ PARA TESTE. NUNCA use estes valores no site de verdade. !!!
name: erivelto-teste
services:
  banco:
    image: postgres:17-alpine
    container_name: erivelto-teste-banco
    restart: "no"
    environment:
      POSTGRES_USER: erivelto
      POSTGRES_PASSWORD: "SO-TESTE-senha-publica-nao-usar"       # SÓ TESTE
      POSTGRES_DB: erivelto
    volumes:
      - banco:/var/lib/postgresql/data      # volume nomeado (não use pasta do Windows aqui)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erivelto -d erivelto"]
      interval: 3s
      timeout: 3s
      retries: 20
  erivelto:
    build: .
    container_name: erivelto-teste
    restart: "no"
    environment:
      ERV_BANCO: "postgresql://erivelto:SO-TESTE-senha-publica-nao-usar@banco:5432/erivelto"   # SÓ TESTE
      ERV_CHAVE_DADOS: "VEVTVEUtbmFvLXVzYXItZW0tcHJvZHVjYW8tMDAwMCE="   # SÓ TESTE (é o texto "TESTE-nao-usar-em-producao-0000!")
      ERV_HTTPS: "1"
      ERV_NOINDEX: "1"
      ERV_TUNEL_TESTE: "1"                # aceita https://*.trycloudflare.com
      ERV_ORIGENS: "http://localhost:8090,http://127.0.0.1:8090"
      ERV_IP_CABECALHO: "CF-Connecting-IP"
    volumes:
      - ./site:/srv/site:ro
      - fotos:/dados                        # volume nomeado: nasce com o dono certo (usuário erv da imagem)
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      banco:
        condition: service_healthy
  tunel:
    image: cloudflare/cloudflared:2026.10.7
    container_name: erivelto-teste-tunel
    restart: on-failure   # se o túnel rápido falhar ao abrir (acontece), tenta de novo sozinho
    # túnel rápido: sem conta, sem token. http2 em vez de QUIC: no Docker Desktop (Windows) e em muitas redes de casa o
    # QUIC (UDP 7844) é bloqueado e o túnel fica em "failed to dial to edge with quic"; http2 usa TCP 443 e passa.
    command: tunnel --no-autoupdate --protocol http2 --edge-ip-version 4 --url http://erivelto:8000
    depends_on:
      - erivelto
volumes:
  banco:
  fotos:
