# Só para o compose.teste.yaml: serve a pasta do projeto como site estático, sem expor o que não é do site.
server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # fora do Google e sem cache (teste)
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    # nada de .git, .gitignore, .idea etc.
    location ~ /\. { return 404; }
    # arquivos antigos e arquivos de trabalho
    location ^~ /_to_delete/ { return 404; }
    location ~* \.(md|txt|yaml|yml|conf|py|sh|ps1|bundle|zip)$ { return 404; }

    # sem servidor ainda: a API responde 404 em JSON e o site segue em modo prévia
    location ^~ /api/ { default_type application/json; return 404 '{"erro":"sem servidor (teste)"}'; }

    location / { try_files $uri $uri/ =404; }
}
